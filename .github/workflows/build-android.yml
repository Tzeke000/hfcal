name: Build Android APK

on:
  push:
    branches: [main, master, 'claude/auto-apex-height-calc-W0kPD']  # TEMP: emulator bring-up
  workflow_dispatch:

# contents: write lets the build publish the signed APK as a release.
permissions:
  contents: write

jobs:
  # An installer built from a commit that fails its own tests is a defect
  # shipped with a version number. The Pages deploy has required this since
  # v1.33; these three were flagged in the same sweep and left ungated.
  tests:
    uses: ./.github/workflows/test.yml

  build:
    needs: tests
    # Pinned: ubuntu-latest moves to a new image on GitHub's schedule, and this
    # build depends on the Android SDK that image ships.
    runs-on: ubuntu-24.04
    outputs:
      signed: ${{ steps.sign.outcome == 'success' }}
    env:
      # Set when the repo has a signing key (see docs/INSTALL.md, "Android
      # signing key"). With one, every build is signed with the SAME key, so a
      # new APK installs over the old one and saved shots survive. Without
      # one, each build gets a throwaway debug key and the phone refuses the
      # update until the old app is uninstalled.
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # android-actions/setup-android@v3 failed on every run from 1 Oct 2026,
      # when GitHub began forcing Node 20 actions onto Node 24. The runner image
      # already carries the Android SDK, so use that instead of downloading it.
      - name: Android SDK (preinstalled on the runner)
        run: |
          set -o pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "::error::No Android SDK at ANDROID_HOME on this runner"; exit 1; }
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKM" || { echo "::error::sdkmanager missing at $SDKM"; exit 1; }
          yes | "$SDKM" --licenses > /dev/null || true
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" | tee logs-sdk.txt

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Add Android platform
        run: npx cap add android 2>&1 | tee logs-cap-add.txt || echo "android platform already added"

      - name: Sync Capacitor
        run: |
          set -o pipefail
          npx cap sync android 2>&1 | tee logs-cap-sync.txt

      # The template ships versionCode 1 / versionName "1.0" forever, so the
      # phone's app info never showed which version was installed.
      # versionCode = major*1000000 + minor*1000 + patch: 1.65.0 -> 1065000.
      # (v1.63-1.64 used major*10000 + minor*100 + patch, which would have run
      # into the next minor at 1.100; every new code is larger than those, so
      # updates still go forward.)
      - name: Stamp the app version into the APK
        run: |
          set -e
          VER=$(node -p "require('./package.json').version")
          CODE=$(node -p "const [a,b,c]=require('./package.json').version.split('.').map(Number); a*1000000+b*1000+c")
          sed -i -E "s/versionCode [0-9]+/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"$VER\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: ./android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../logs-gradle-debug.txt

      # Only without a signing key. Once the key exists, a debug APK handed
      # out by mistake is one more phone stuck on a throwaway key.
      - name: Upload debug APK (no signing key configured)
        if: env.HAS_SIGNING_KEY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hf-field-antenna-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # For the emulator job only: the debug build is the one whose WebView a
      # test can attach to. Short-lived and named so nobody installs it.
      - name: Hand the debug APK to the device test
        uses: actions/upload-artifact@v4
        with:
          name: ci-device-test-debug-apk-do-not-install
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

      - name: Build release APK
        id: release
        working-directory: ./android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee ../logs-gradle-release.txt
        # With a key, the release APK IS the product — a failure must fail.
        continue-on-error: ${{ env.HAS_SIGNING_KEY != 'true' }}

      - name: Sign release APK with the repo's key
        id: sign
        if: env.HAS_SIGNING_KEY == 'true' && steps.release.outcome == 'success'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
            --out hf-field-antenna.apk "$RUNNER_TEMP/aligned.apk" 2>&1 | tee logs-sign.txt
          "$BT/apksigner" verify --print-certs hf-field-antenna.apk | head -3
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload signed APK
        if: steps.sign.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: hf-field-antenna-apk
          path: hf-field-antenna.apk
          retention-days: 90

      # The raw logs are not always reachable; put the end of whatever failed
      # into the run's annotations, where the error can be read at a glance.
      - name: Report what failed
        if: failure() || steps.release.outcome == 'failure'
        run: |
          for f in logs-*.txt; do
            [ -f "$f" ] || continue
            body=$(tail -n 30 "$f" | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$f::$body"
          done

  # The app on a real Android system (an emulator on GitHub's machine): does
  # the update install over the version people have, and does the app do what
  # the desktop tests can only pretend to check? scripts/android/device-test.mjs
  device-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (Playwright drives the app's WebView)
        run: npm ci

      - name: Get the APKs this build made
        uses: actions/download-artifact@v4
        with:
          path: apks

      - name: Start an Android emulator
        run: |
          set -eo pipefail
          # Hardware acceleration for the emulator on GitHub's Linux machines.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          SDK="$ANDROID_HOME"; BIN="$SDK/cmdline-tools/latest/bin"
          IMG="system-images;android-34;google_apis;x86_64"
          # One folder for the virtual phone, named for both tools: avdmanager
          # and the emulator otherwise look in different places ("Unknown AVD
          # name" and a boot wait that never ends).
          export ANDROID_AVD_HOME="$HOME/.android/avd"; mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          (yes || true) | "$BIN/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$BIN/sdkmanager" --install emulator platform-tools "$IMG" > logs-sdk.txt 2>&1 || { tail -c 2000 logs-sdk.txt; exit 1; }
          echo no | "$BIN/avdmanager" create avd -n hfcal -k "$IMG" -d pixel_6 --force
          "$SDK/emulator/emulator" -list-avds
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"; export PATH="$SDK/platform-tools:$PATH"
          nohup "$SDK/emulator/emulator" -avd hfcal -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -camera-back none -camera-front none > logs-emulator.txt 2>&1 &
          EMU=$!
          booted=""
          for i in $(seq 1 120); do
            kill -0 $EMU 2>/dev/null || { echo "::error title=Emulator exited::$(tail -5 logs-emulator.txt | tr '\n' ' ')"; exit 1; }
            if [ "$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then booted=1; break; fi
            sleep 5
          done
          [ -n "$booted" ] || { echo "::error title=Emulator did not boot in 10 min::$(tail -5 logs-emulator.txt | tr '\n' ' ')"; exit 1; }
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82 || true
          echo "booted: Android $(adb shell getprop ro.build.version.release | tr -d '\r')"

      # The promise of the signing key: a new APK installs OVER the one people
      # already have, without uninstalling, and keeps its data.
      - name: The update installs over the published APK
        if: needs.build.outputs.signed == 'true'
        run: |
          set -e
          PKG=com.tzeke000.hffieldantenna
          NEW=apks/hf-field-antenna-apk/hf-field-antenna.apk
          if curl -fsSL -o prev.apk "https://github.com/${GITHUB_REPOSITORY}/releases/download/android/hf-field-antenna.apk"; then
            adb install prev.apk
            PREV=$(adb shell dumpsys package $PKG | grep -m1 versionName | tr -d '\r ')
            adb install -r "$NEW" 2>&1 | tee logs-update.txt
            grep -q Success logs-update.txt || { echo "::error title=Update did not install over the published APK::$(tail -3 logs-update.txt)"; exit 1; }
            NOW=$(adb shell dumpsys package $PKG | grep -m1 versionName | tr -d '\r ')
            echo "::notice title=PASS update installs over the published APK::$PREV -> $NOW"
          else
            echo "::notice title=No published APK yet::nothing to update from"
            adb install "$NEW"
          fi
          adb shell am start -W -n $PKG/.MainActivity | tail -2
          sleep 8
          adb shell pidof $PKG > /dev/null || { echo "::error title=Signed APK does not stay running::"; exit 1; }
          echo "::notice title=PASS signed APK launches::"
          adb uninstall $PKG

      - name: Check the app on the phone
        run: |
          adb install apks/ci-device-test-debug-apk-do-not-install/app-debug.apk
          adb logcat -c || true
          node scripts/android/device-test.mjs

      - name: Keep what the phone showed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-report
          path: |
            device-report.json
            device-final.png
            logs-*.txt
          retention-days: 14
          if-no-files-found: ignore

  # Publish only what was built AND passed on the phone. A run's artifacts
  # need a GitHub login to download and expire; the release does neither —
  # one fixed public link, always the newest APK.
  publish:
    needs: [build, device-test]
    if: needs.build.outputs.signed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hf-field-antenna-apk

      - name: Publish the signed APK (public download page)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VER=$(node -p "require('./package.json').version")
          sed "s/{{VERSION}}/${VER}/g" scripts/release/android-notes.md > notes.md
          # Not "latest": /releases/latest is where the Windows installer lives.
          bash scripts/release/publish-asset.sh android hf-field-antenna.apk hf-field-antenna.apk \
            "Android app v${VER}" notes.md false
